services:
  - type: web
    name: sg-holiday-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: AMADEUS_CLIENT_ID
        sync: false
      - key: AMADEUS_CLIENT_SECRET
        sync: false
      - key: AMADEUS_ENV
        value: test
      - key: DB_PATH
        value: /tmp/holidays.db
      - key: CACHE_DIR
        value: /tmp/cache
      - key: EXTRA_ORIGIN
        sync: false
